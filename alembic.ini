# Alembic configuration for the leadgen auth database.
# `leadgen.db.migrate` overrides script_location with an absolute path, so this
# file only matters for direct CLI use (`alembic upgrade head` from the repo root).

[alembic]
script_location = src/leadgen/db/migrations
prepend_sys_path = .
version_path_separator = os
# Empty on purpose: env.py falls back to leadgen.config.database_url()
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "0.1.0"
description = "B2B sales lead generation suite: Shortlister + LinkedIn Finder agents, FastAPI orchestrator, React dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # --- Backend (FastAPI orchestrator) ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=1.8.2",

    # --- Shared ---
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",

    # --- Auth / persistence (leadgen.db + leadgen.auth) ---
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",

    # --- Agents (LangGraph / LangChain) ---
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "tiktoken>=0.7.0",
    "aiofiles>=23.0.0",
    "aiosqlite>=0.19.0",

    # --- Shortlister data + automation ---
    "tradingview-screener>=3.0.0rc1",
    "yfinance>=0.2.0",
    "financedatabase>=2.2.0",
    "streamlit>=1.30.0",
    "selenium>=4.10.0",
    "webdriver-manager>=4.0.0",

    # --- scripts/pivot_export.py ---
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic scripts are not Python modules, so they need to be declared explicitly.
"leadgen.db.migrations" = ["*.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
src = ["src", "tests", "scripts"]
line-length = 120
target-version = "py310"
extend-exclude = ["var", "docs", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
